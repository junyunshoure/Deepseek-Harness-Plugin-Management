# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: detailed
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
- id: web-ui-pet
  name: "@linxin666/dsh-pet"
  config:
    visible: true
    size: 160
    right: 267
    bottom: 1039
    petId: whale-girl-refined
- id: web-ui-ssh
  disabled: false
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openai:
        baseURL: https://YOUR-ENDPOINT.example.com/v1
        models:
          - id: gpt-5.6-sol
            name: GPT-5.6 Sol
            contextWindow: 272000
            maxTokens: 128000
            input:
              - text
              - image
          - id: gpt-6-luna
            name: GPT-6 Luna
            contextWindow: 272000
            maxTokens: 128000
            input:
              - text
              - image
          - id: gpt-6-sol
            name: GPT-6 Sol
            contextWindow: 272000
            maxTokens: 128000
            input:
              - text
              - image
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
            contextWindow: 272000
            maxTokens: 128000
            input:
              - text
              - image
          - id: gpt-6-astra
            name: GPT-6 Astra
            contextWindow: 272000
            maxTokens: 128000
            input:
              - text
              - image
        apiKeyEnv: OPENAI_API_KEY
      anthropic:
        baseURL: https://YOUR-ENDPOINT.example.com/v1
        models:
          - id: claude-opus-4-8
            name: Claude Opus 4.8
            contextWindow: 1000000
            maxTokens: 128000
            input:
              - text
              - image
        apiKeyEnv: ANTHROPIC_API_KEY
      anthropicmini:
        displayName: cloude kiro
        apiKeyEnv: ANTHROPICMINI_API_KEY
        api: anthropic-messages
        baseURL: https://YOUR-ENDPOINT.example.com/v1
        models:
          - id: claude-fable-5
            name: claude-fable-5
          - id: claude-opus-5
            name: claude-opus-5
          - id: claude-opus-5-5
            name: claude-opus-5-5
          - id: claude-sonnet-5
            name: claude-sonnet-5
      google:
        baseURL: https://YOUR-ENDPOINT.example.com/v1
        models:
          - id: gemini-3.8-flash
            name: Gemini 3.8 Flash
            contextWindow: 1048576
            maxTokens: 65536
            input:
              - text
              - image
        apiKeyEnv: GOOGLE_API_KEY
      grok:
        apiKeyEnv: GROK_API_KEY
        api: anthropic-messages
        baseURL: https://YOUR-ENDPOINT.example.com/v1
        models:
          - id: grok-4.7
            name: Grok 4.7
          - id: grok-imagine-image-2.0
            name: Grok Imagine Image 2.0
          - id: grok-imagine-image-quality
            name: Grok Imagine Image Quality
          - id: grok-imagine-video
            name: Grok Imagine Video
          - id: grok-imagine-video-1.5
            name: Grok Imagine Video 1.5
          - id: grok-imagine-video-1.5-preview
            name: grok-imagine-video-1.5-preview
      openai-guankey:
        apiKeyEnv: OPENAI_GUANKEY_API_KEY
        api: openai-completions
        baseURL: https://YOUR-ENDPOINT.example.com/v1
        models:
          - id: gpt-6-astra
            name: GPT-6 Astra
          - id: gpt-6-sol
            name: GPT-6 Sol
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
      deepseekzhongzhuan:
        apiKeyEnv: DEEPSEEKZHONGZHUAN_API_KEY
        api: openai-completions
        baseURL: https://YOUR-ENDPOINT.example.com/v1
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    baseURL: https://YOUR-ENDPOINT.example.com/v1
    retryPolicy:
      mode: normal
      retryableCodes:
        - EMPTY_RESPONSE
        - RATE_LIMIT
        - SERVER
        - TIMEOUT
        - TRANSPORT
        - MALFORMED_RESPONSE
    models: []
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: false
- id: tool-fs
  disabled: false
- id: tool-fs-search
  disabled: false
- id: tool-jobs
  disabled: false
- id: bash-sandbox
  disabled: true
# 会话声明瘦身（2026-10-26）：hindsight 每轮重发的工具指南 3234 B，
# 默认 pageRefreshEveryTurns=1 即每轮都发。放到 5 轮一次，细节手册仍在
# ~/.dsh/skills 与包内 skill/SKILL.md 里按需加载。
- id: hindsight
  name: "@vectorize-io/hindsight-coding-agents/dsh"
  env:
    HINDSIGHT_PAGE_REFRESH_EVERY_TURNS: "5"
  disabled: false
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
- id: memory-fusion-runtime
  disabled: false
