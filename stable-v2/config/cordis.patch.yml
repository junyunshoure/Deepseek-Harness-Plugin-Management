# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# --- 以下条目由 DSH 插件整合包分发：只含功能性开关 ---
# 模型供应商（llm-*）、默认模型、外观主题、界面偏好、宠物位置这类「每人不同」的条目
# 一律不分发，安装器也不会替你写；需要时在 DSH 设置页自行配置。
- id: web-ui-ssh
  disabled: false
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: false
- id: tool-fs
  disabled: false
- id: tool-fs-search
  disabled: false
- id: tool-jobs
  disabled: false
- id: bash-sandbox
  disabled: true
# 会话声明瘦身（2026-10-26）：hindsight 每轮重发的工具指南 3234 B，
# 默认 pageRefreshEveryTurns=1 即每轮都发。放到 5 轮一次，细节手册仍在
# ~/.dsh/skills 与包内 skill/SKILL.md 里按需加载。
- id: hindsight
  name: "@vectorize-io/hindsight-coding-agents/dsh"
  env:
    HINDSIGHT_PAGE_REFRESH_EVERY_TURNS: "5"
  disabled: false
- id: memory-fusion-runtime
  disabled: false
# pack-patch 2.1.3（ISSUE-1）：billion-context 默认 autoUpdate=true，装完会自己把
# payload/node_modules/billion-context 换成 npm 上的新版本，checksums.json 立刻失配，
# 于是之后每次 VERIFY.cmd 都报「文件内容与校验清单不符」。这里在插件进程内把开关关掉；
# 安装器还会同时写 ~/.config/billion-context/billion-context.json 的 autoUpdate:false，
# 依赖也钉成了精确版本 —— 三重保险，任一生效即可。
- id: bili-native
  name: billion-context
  env:
    ACP_AUTO_UPDATE: "0"
  disabled: false
